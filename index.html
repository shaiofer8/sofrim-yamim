<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סופרים ימים</title>
<meta name="description" content="ספירה לאחור לאירועים, חגים ומועדים — בעברית מלאה">
<meta name="theme-color" content="#1b1035" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f0fa" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סופרים ימים">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<!--
  Story 3.1 / AD-5: Google AdSense web tag (NOT AdMob native SDK).
  ⚠️ PLACEHOLDER CLIENT ID -- replace ca-pub-0000000000000000 in billing.js
  (and the matching data-ad-client/data-ad-slot in the #ad-banner <ins>
  below) with the real values once the AdSense account + ad unit exist.
  2026-08-22 audit: this used to be a static, unconditional <script> tag
  here, so it fetched from Google on every load even while
  MONETIZATION_ENABLED is false -- a real, unnecessary network request for
  a feature that's fully off. billing.js now injects this script itself,
  and only when the flag is on (see its MONETIZATION_ENABLED-gated loader
  near the top of that file).
-->
</head>
<body>
<div id="liveStatus" class="sr-only" role="status" aria-live="polite"></div>

<header class="app-header">
  <h1 data-i18n="app.heading">🗓️ סופרים ימים</h1>
  <div class="header-actions">
    <!-- 2026-08-22 audit: default-hidden in markup, not just via JS. Both
         feature flags are currently off and billing.js (last-loaded, per
         AD-1) is what reveals this button when either is on -- hiding it
         here too means there's no flash-of-visible-button before that
         script runs, and it fails *safe* (stays hidden) if billing.js is
         ever blocked/fails to load, instead of failing open. -->
    <button id="settingsBtn" class="btn-icon btn-labeled" aria-label="הגדרות" data-i18n-aria="header.settings" hidden>⚙️<span class="btn-label" data-i18n="header.settingsLabel">הגדרות</span></button>
    <button id="shareBtn" class="btn-icon btn-labeled" aria-label="שתף" data-i18n-aria="header.share" title="שתף עם חברים" data-i18n-title="header.shareTitle">📤<span class="btn-label" data-i18n="header.shareLabel">שיתוף</span></button>
    <button id="presetsBtn" class="btn-icon btn-labeled" aria-label="חגים ומועדים" data-i18n-aria="header.holidays">✡️<span class="btn-label" data-i18n="header.holidaysLabel">חגים</span></button>
    <button id="addBtn" class="fab" aria-label="הוספת אירוע" data-i18n-aria="header.add">+</button>
  </div>
</header>

<div id="heroCard" class="hero-card" hidden></div>

<main id="eventList" class="event-list">
  <!-- events render here -->
</main>

<p id="emptyState" class="empty-state" data-i18n="main.empty" hidden>אין עדיין אירועים. הוסיפו את הראשון.</p>

<!-- Add/Edit dialog -->
<dialog id="eventDialog" aria-labelledby="dialogTitle">
  <form id="eventForm" method="dialog">
    <h2 id="dialogTitle" data-i18n="dialog.newEvent">אירוע חדש</h2>

    <label for="eventName" data-i18n="dialog.eventName">שם האירוע</label>
    <input id="eventName" type="text" required placeholder="לדוגמה: יום הולדת לאמא" data-i18n-placeholder="dialog.eventNamePlaceholder">

    <!-- 2026-08-23: בחירת תאריך עברי -- toggle בין קלט לועזי (ברירת מחדל,
         זהה למה שהיה) לקלט עברי (יום/חודש/שנה, ר' hebrew-date.js). בשני
         המצבים #eventDate נשאר מקור-האמת היחיד שנשמר/נספר (עקבי עם AD-2 --
         אין מקור-אמת כפול) -- הבחירה העברית רק ממלאת אותו דרך
         initHebrewDatePicker() ב-app.js, אף קוד שמירה/ספירה/רינדור אחר לא
         צריך לדעת שהמצב הזה קיים בכלל. -->
    <div class="date-mode-toggle" role="radiogroup" aria-label="סוג תאריך" data-i18n-aria="dialog.dateType">
      <button type="button" id="dateModeGregorianBtn" class="date-mode-btn" role="radio" aria-checked="true" data-i18n="dialog.gregorian">לועזי</button>
      <button type="button" id="dateModeHebrewBtn" class="date-mode-btn" role="radio" aria-checked="false" data-i18n="dialog.hebrew">עברי</button>
    </div>

    <div id="gregorianDateField">
      <label for="eventDate" data-i18n="dialog.date">תאריך</label>
      <input id="eventDate" type="date" required>
    </div>

    <div id="hebrewDateField" hidden>
      <label id="hebrewDateLabel" data-i18n="dialog.hebrewDate">תאריך עברי</label>
      <div class="hebrew-date-row" role="group" aria-labelledby="hebrewDateLabel">
        <select id="hebrewDay" aria-label="יום בחודש" data-i18n-aria="dialog.hebrewDay"></select>
        <select id="hebrewMonth" aria-label="חודש עברי" data-i18n-aria="dialog.hebrewMonth"></select>
        <select id="hebrewYear" aria-label="שנה עברית" data-i18n-aria="dialog.hebrewYear"></select>
      </div>
      <p id="hebrewDatePreview" class="presets-hint" aria-live="polite"></p>
    </div>

    <label for="eventEmoji" data-i18n="dialog.icon">אייקון</label>
    <select id="eventEmoji">
      <option value="🎉" data-i18n="emoji.celebration">🎉 חגיגה</option>
      <option value="🎂" data-i18n="emoji.birthday">🎂 יום הולדת</option>
      <option value="💍" data-i18n="emoji.wedding">💍 חתונה</option>
      <option value="💃" data-i18n="emoji.bachelorette">💃 מסיבת רווקות</option>
      <option value="🍻" data-i18n="emoji.bachelor">🍻 מסיבת רווקים</option>
      <option value="💧" data-i18n="emoji.mikveh">💧 טבילה במקווה</option>
      <option value="✈️" data-i18n="emoji.trip">✈️ טיול</option>
      <option value="🧳" data-i18n="emoji.backFromVacation">🧳 חזרה מחופשה</option>
      <option value="🎒" data-i18n="emoji.schoolStart">🎒 תחילת לימודים</option>
      <option value="🕎" data-i18n="emoji.holiday">🕎 חג</option>
      <option value="🕯️" data-i18n="emoji.memorial">🕯️ אזכרה</option>
      <option value="🎓" data-i18n="emoji.graduation">🎓 סיום לימודים</option>
      <option value="💼" data-i18n="emoji.work">💼 עבודה / יעד</option>
      <option value="⭐" data-i18n="emoji.other">⭐ אחר</option>
    </select>

    <label class="favorite-toggle-row">
      <input type="checkbox" id="eventFavorite">
      <span data-i18n="dialog.favorite">⭐ הצג כמועדף על סמל האפליקציה</span>
    </label>

    <div class="dialog-actions">
      <button type="button" id="cancelBtn" class="btn-secondary" data-i18n="button.cancel">ביטול</button>
      <button type="button" id="deleteBtn" class="btn-danger" data-i18n="button.delete" hidden>מחיקה</button>
      <button type="button" id="calendarBtn" class="btn-secondary" data-i18n="dialog.addToCalendar" hidden>📅 הוסף ליומן</button>
      <button type="submit" id="saveBtn" class="btn-primary" data-i18n="button.save">שמירה</button>
    </div>
  </form>
</dialog>

<!-- Presets dialog: Israeli/Jewish holidays -->
<dialog id="presetsDialog" aria-labelledby="presetsDialogTitle">
  <div class="presets-content">
    <h2 id="presetsDialogTitle" data-i18n="presets.title">הוספה מהירה — חגים ומועדים</h2>
    <p class="presets-hint" data-i18n="presets.hint">בחרו אירוע כדי להוסיף אותו לרשימה שלכם.</p>
    <ul id="presetsList" class="presets-list"></ul>
    <p id="presetsEmpty" class="presets-hint" data-i18n="presets.empty" hidden>רשימת החגים לא מעודכנת כרגע. תוכלו להוסיף אירוע ידנית.</p>
    <div class="dialog-actions">
      <button type="button" id="closePresetsBtn" class="btn-secondary" data-i18n="button.close">סגירה</button>
    </div>
  </div>
</dialog>

<!-- Settings dialog (Story 2.3) -->
<dialog id="settingsDialog" aria-labelledby="settingsDialogTitle">
  <div class="presets-content">
    <h2 id="settingsDialogTitle" data-i18n="settings.title">הגדרות</h2>
    <div class="settings-row" id="notifSettingsRow">
      <label for="notifToggle" class="settings-row-label" data-i18n="settings.notifications">התראות</label>
      <input type="checkbox" id="notifToggle" class="settings-toggle" role="switch">
    </div>
    <p id="notifDeniedHint" class="presets-hint" hidden></p>

    <!-- Story 3.2 / AD-4: hidden entirely by default (billing.js reveals
         it only when the Digital Goods API actually exists -- i.e.
         running as an installed TWA; not shown at all in a regular
         browser tab, where a purchase attempt could never complete). -->
    <button type="button" id="purchaseBtn" class="btn-primary purchase-btn" hidden>
      <span class="purchase-btn-label" data-i18n="billing.removeAds">הסרת פרסומות — $1.99</span>
      <span class="purchase-spinner" hidden aria-hidden="true"></span>
    </button>
    <p id="purchaseError" class="presets-hint" role="alert" hidden></p>

    <!-- כפתור שיתוף -- navigator.share() כשקיים (מובייל/TWA), נופל חזרה
         להעתקת-קישור ל-clipboard בדפדפן שולחני שלא תומך ב-Web Share API
         (ר' app.js, ליד רישום כפתורי דיאלוג-ההגדרות). המשוב על ה-fallback
         עובר דרך #liveStatus הקיים (announce()), אין צורך באלמנט נפרד. -->
    <button type="button" id="shareAppBtn" class="btn-secondary" data-i18n="settings.shareApp">שיתוף האפליקציה</button>

    <!-- Language selector -->
    <div class="settings-row">
      <label class="settings-row-label" data-i18n="settings.language">שפה</label>
      <div class="language-buttons">
        <button type="button" id="langHebrewBtn" class="btn-secondary lang-btn lang-btn-selected" data-i18n="settings.hebrew">עברית</button>
        <button type="button" id="langEnglishBtn" class="btn-secondary lang-btn" data-i18n="settings.english">English</button>
      </div>
    </div>

    <!-- יצירת קשר בוואטסאפ -- קישור wa.me רגיל, לא תלוי-JS. מספר הטלפון
         ניתן ע"י המשתמש (2026-08-23) -- אותו מספר נמצא בשימוש בשתי
         האפליקציות. -->
    <a id="contactWhatsappLink" class="btn-secondary" href="https://wa.me/972504812348" target="_blank" rel="noopener noreferrer" data-i18n="settings.whatsapp">יצירת קשר בוואטסאפ</a>

    <div class="dialog-actions">
      <button type="button" id="closeSettingsBtn" class="btn-secondary" data-i18n="button.close">סגירה</button>
    </div>
  </div>
</dialog>

<!-- Swipe-to-delete confirmation sheet (Story 1.7) -->
<dialog id="deleteConfirmDialog" aria-labelledby="deleteConfirmTitle">
  <div class="presets-content">
    <h2 id="deleteConfirmTitle" data-i18n="delete.title">מחיקת אירוע</h2>
    <p id="deleteConfirmText" class="presets-hint"></p>
    <div class="dialog-actions">
      <button type="button" id="deleteConfirmCancelBtn" class="btn-secondary" data-i18n="button.cancel">ביטול</button>
      <button type="button" id="deleteConfirmOkBtn" class="btn-danger" data-i18n="button.delete">מחיקה</button>
    </div>
  </div>
</dialog>

<!-- Story 3.1 / AD-9: static element, main screen only, never inside a
     dialog. Existence is permanent -- billing.js only ever toggles the
     "hidden" attribute (hasRemovedAds()), never creates/removes this
     element. Visible by default (no purchase = ads on) so there's no
     flash-of-hidden-content before billing.js decides. The <ins> markup
     itself is static too, but *requesting* an ad into it (pushing to
     window.adsbygoogle) is billing.js's job, gated on hasRemovedAds() --
     see there. A paying user should never pay the network/battery cost
     of an ad request just because the (hidden) slot still exists. -->
<div id="ad-banner" class="ad-banner" aria-label="פרסומת" data-i18n-aria="main.ad">
  <!--
    ⚠️ PLACEHOLDER data-ad-client / data-ad-slot -- see the loader
    <script> comment in <head>. Both must be replaced with real AdSense
    values (a real ad unit, created in the AdSense dashboard, has its
    own slot id distinct from the account-wide client id).
  -->
  <!--
    Deliberately NOT data-ad-format="auto" + data-full-width-responsive:
    that combination lets AdSense pick any shape it likes, including tall
    square units, and it picked a ~390px one (most of a phone screen) in
    a real demo. "horizontal" asks for wide-and-short stock only, and the
    explicit 50px height caps what can render even if a wider unit is
    served. Together with .ad-banner's fixed height in style.css this
    keeps the bar at ~8% of a phone viewport instead of ~50%.
  -->
  <ins class="adsbygoogle"
       style="display:block; width:100%; height:50px"
       data-ad-client="ca-app-pub-4066391446449273"
       data-ad-slot="1489527205"
       data-ad-format="horizontal"></ins>
</div>

<script src="holidays.js"></script>
<script src="hebrew-date.js"></script>
<script src="app.js"></script>
<script src="notifications.js"></script>
<script src="billing.js"></script>
</body>
</html>
