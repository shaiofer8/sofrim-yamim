<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סופרים ימים</title>
<meta name="description" content="ספירה לאחור לאירועים, חגים ומועדים — בעברית מלאה">
<meta name="theme-color" content="#1b1035" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f0fa" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סופרים ימים">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="liveStatus" class="sr-only" role="status" aria-live="polite"></div>

<header class="app-header">
  <h1>🗓️ סופרים ימים</h1>
  <div class="header-actions">
    <button id="settingsBtn" class="btn-icon" aria-label="הגדרות">⚙️</button>
    <button id="presetsBtn" class="btn-icon" aria-label="חגים ומועדים">✡️</button>
    <button id="addBtn" class="fab" aria-label="הוספת אירוע">+</button>
  </div>
</header>

<div id="heroCard" class="hero-card" hidden></div>

<main id="eventList" class="event-list">
  <!-- events render here -->
</main>

<p id="emptyState" class="empty-state" hidden>
  אין עדיין אירועים. הוסיפו את הראשון.
</p>

<!-- Add/Edit dialog -->
<dialog id="eventDialog" aria-labelledby="dialogTitle">
  <form id="eventForm" method="dialog">
    <h2 id="dialogTitle">אירוע חדש</h2>

    <label for="eventName">שם האירוע</label>
    <input id="eventName" type="text" required placeholder="לדוגמה: יום הולדת לאמא">

    <label for="eventDate">תאריך</label>
    <input id="eventDate" type="date" required>

    <label for="eventEmoji">אייקון</label>
    <select id="eventEmoji">
      <option value="🎉">🎉 חגיגה</option>
      <option value="🎂">🎂 יום הולדת</option>
      <option value="💍">💍 חתונה</option>
      <option value="✈️">✈️ טיול</option>
      <option value="🕎">🕎 חג</option>
      <option value="🎓">🎓 סיום לימודים</option>
      <option value="💼">💼 עבודה / יעד</option>
      <option value="⭐">⭐ אחר</option>
    </select>

    <div class="dialog-actions">
      <button type="button" id="cancelBtn" class="btn-secondary">ביטול</button>
      <button type="button" id="deleteBtn" class="btn-danger" hidden>מחיקה</button>
      <button type="submit" id="saveBtn" class="btn-primary">שמירה</button>
    </div>
  </form>
</dialog>

<!-- Presets dialog: Israeli/Jewish holidays -->
<dialog id="presetsDialog" aria-labelledby="presetsDialogTitle">
  <div class="presets-content">
    <h2 id="presetsDialogTitle">הוספה מהירה — חגים ומועדים</h2>
    <p class="presets-hint">בחרו אירוע כדי להוסיף אותו לרשימה שלכם.</p>
    <ul id="presetsList" class="presets-list"></ul>
    <p id="presetsEmpty" class="presets-hint" hidden>רשימת החגים לא מעודכנת כרגע. תוכלו להוסיף אירוע ידנית.</p>
    <div class="dialog-actions">
      <button type="button" id="closePresetsBtn" class="btn-secondary">סגירה</button>
    </div>
  </div>
</dialog>

<!-- Settings dialog (Story 2.3) -->
<dialog id="settingsDialog" aria-labelledby="settingsDialogTitle">
  <div class="presets-content">
    <h2 id="settingsDialogTitle">הגדרות</h2>
    <div class="settings-row">
      <label for="notifToggle" class="settings-row-label">התראות</label>
      <input type="checkbox" id="notifToggle" class="settings-toggle" role="switch">
    </div>
    <p id="notifDeniedHint" class="presets-hint" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="closeSettingsBtn" class="btn-secondary">סגירה</button>
    </div>
  </div>
</dialog>

<!-- Swipe-to-delete confirmation sheet (Story 1.7) -->
<dialog id="deleteConfirmDialog" aria-labelledby="deleteConfirmTitle">
  <div class="presets-content">
    <h2 id="deleteConfirmTitle">מחיקת אירוע</h2>
    <p id="deleteConfirmText" class="presets-hint"></p>
    <div class="dialog-actions">
      <button type="button" id="deleteConfirmCancelBtn" class="btn-secondary">ביטול</button>
      <button type="button" id="deleteConfirmOkBtn" class="btn-danger">מחיקה</button>
    </div>
  </div>
</dialog>

<script src="holidays.js"></script>
<script src="app.js"></script>
<script src="notifications.js"></script>
</body>
</html>
